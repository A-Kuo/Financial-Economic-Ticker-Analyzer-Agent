[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ticker-agent"
version = "0.1.0"
description = "Financial/Economic Ticker Analyzer with Local AI Agents (Ollama)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "ollama>=0.3.0",
    "newsapi-python>=0.2.7",
    "rich>=13.7",
    "click>=8.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "schedule>=1.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.7",
    "ruff>=0.1",
]

[project.scripts]
ticker = "ticker_agent.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=src/ticker_agent --cov-report=html --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"
